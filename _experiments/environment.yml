# ============================================================================
# Reference snapshot of the verified experiment environment — conda env
# "buildtool" (Python 3.11), from a full `conda env export` (2026-06-02, Windows).
#
# THIS FILE IS A HINT FOR COAUTHORS, *NOT* A DIRECT-INSTALL SPEC:
#   - Build strings are win-64 locked (e.g. =py311haa95532_0) and will not
#     resolve on other OSes.
#   - `optboolnet` is installed editable from THIS repository (see the pip
#     section), not from PyPI.
#   - `pyboolnet==3.0.16` was actually installed from git
#     (github.com/hklarner/pyboolnet @ 3394310...); the export flattened it to a
#     version pin.
#   - NuSMV (infinite checker only) needs the `nusmv` wrapper (`import nusmv`)
#     plus a `NuSMV` binary on PATH. Listed below from colomoto::nusmv
#     (https://anaconda.org/colomoto/nusmv); on this machine buildtool used an
#     external NuSMV 2.7.1 on PATH instead (C:\NuSMV-2.7.1-win64\bin).
#
# To build an equivalent env, create from a portable spec and then
# `pip install -e .` from the repo root (see _experiments/README.md).
# ============================================================================
